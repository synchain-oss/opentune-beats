# cargo-deny policy: every crate compiled into the binary must be permissively licensed, come
# from crates.io, and carry no known vulnerability. Run by the `licenses` job of ci.yml as
# `cargo deny --locked check licenses bans sources advisories`.
#
# Adding a license to `allow` is a licensing decision: the list must stay within the range
# CLAUDE.md §4 allows (MIT, Apache-2.0, BSD, ISC, Zlib, Unicode), a new entry needs a reason in
# the pull request, and GPL, LGPL and AGPL are never allowed, nor are crates without a license.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# A yanked or unmaintained crate in the graph is a warning to act on, not something to ignore
# silently. `unsound` applies to the crates this binary actually compiles.
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
# License texts are matched with a confidence score; below this the crate counts as unlicensed.
confidence-threshold = 0.93
# An allowed license that no crate uses is reported, not failed: the list is curated, and an
# entry is added only together with a crate that needs it. Adding one is a licensing decision and
# must stay within the range CLAUDE.md §4 allows.
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
# A wildcard version requirement ("*", "1.*") hides which release is built.
wildcards = "deny"
# Two versions of the same crate usually mean an outdated dependency somewhere. Warn rather
# than fail: the analysis engine will pull in a large tree, and a duplicate is not by itself a
# defect. Add a `skip` entry with a reason when a duplicate cannot be removed.
multiple-versions = "warn"
# Crates that must never enter the graph. `openssl` is replaced by `rustls`; the ONNX runtime is
# linked from a pinned, checksummed artifact instead of a build-time downloader.
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
# Everything comes from crates.io: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
